services:
  postgres:
    image: postgres:16-alpine
    container_name: form-builder-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: form_builder
      POSTGRES_PASSWORD: form_builder
      POSTGRES_DB: form_builder
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U form_builder -d form_builder"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: